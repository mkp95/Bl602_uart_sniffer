name: Build BL602 Firmware

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout BL602 SDK
        uses: actions/checkout@v4
        with:
          repository: bouffalolab/bouffalo_sdk
          path: bouffalo_sdk
          ref: master

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3 python3-pip git wget curl unzip

      - name: Install RISC-V toolchain
        run: |
          if [ ! -d "$HOME/riscv" ]; then
            wget -q https://github.com/xpack-dev-tools/riscv-none-elf-gcc-xpack/releases/download/v13.2.0-2/xpack-riscv-none-elf-gcc-13.2.0-2-linux-x64.tar.gz -O /tmp/riscv-gcc.tar.gz
            mkdir -p $HOME/riscv
            tar -xzf /tmp/riscv-gcc.tar.gz -C $HOME/riscv --strip-components=1
          fi
          echo "RISCV_TOOLCHAIN=$HOME/riscv/bin" >> $GITHUB_PATH

      - name: Configure CMake
        env:
          BL_SDK_BASE: ${{ github.workspace }}/bouffalo_sdk
          CROSS_COMPILE: riscv-none-elf-
        run: |
          cmake -S bl602_uart_wifi_fw -B build \
            -G Ninja \
            -DBL602_SDK_PATH=$PWD/bouffalo_sdk \
            -DBL602_CHIP=bl602 \
            -DBL602_BOARD=bl602evb

      - name: Build firmware
        run: |
          cmake --build build

      - name: Show build artifacts
        run: |
          ls -lh build/*.bin build/*.elf 2>/dev/null || true

      - name: Upload firmware bin
        uses: actions/upload-artifact@v4
        with:
          name: bl602-firmware
          path: build/*.bin
          retention-days: 7
